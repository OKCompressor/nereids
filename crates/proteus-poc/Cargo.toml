[package]
name = "proteus-poc"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-LNCL-1.2"
description = "Proteus P0 snapshot/delta exactness proof over Nereids Direct-ID V2"

[lib]
name = "proteus_poc"
path = "src/lib.rs"

[[bin]]
name = "proteus-p0-fixture"
path = "src/bin/proteus-p0-fixture.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nereids = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
