[package]
name = "nereids"
version = "0.13.37-alpha.1"
edition = "2021"
license = "LicenseRef-LNCL-1.2"
description = "Nereids structural bridge module for DU/BPE experiments"

[lib]
name = "nereids"
path = "src/lib.rs"

[[bin]]
name = "nereids"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
